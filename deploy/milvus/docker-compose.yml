# AI数字化人才平台 - Milvus Standalone（独立部署）
# 容器名/卷均带 aitalent-milvus-* 前缀，严禁触碰其他项目的 Milvus 数据
# 启动（一键交付会自动调用，一般无需手工执行）：docker compose up -d
# 停止：docker compose down          # 保留数据卷
# 彻底清理：docker compose down -v   # 同时删除数据卷
# 端口与容器名可通过环境变量覆盖（默认值与旧版完全一致，客户无需改动）：
#   MYSQL_PORT / MILVUS_PORT / MILVUS_METRICS_PORT / COMPOSE_PROJECT_NAME / CONTAINER_PREFIX
#   MYSQL_ROOT_PASSWORD / MYSQL_DB
# 例：本机 3306/19530 被占用时，bootstrap 会按根 .env 自动注入隔离值。

version: "3.5"

services:
  # 交付用 MySQL 8：密码/库名由 scripts/A/bootstrap.py 通过环境变量注入
  mysql:
    container_name: ${CONTAINER_PREFIX:-aitalent}-mysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-aitalent_2026}
      MYSQL_DATABASE: ${MYSQL_DB:-ai_talent}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - aitalent-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  etcd:
    container_name: ${CONTAINER_PREFIX:-aitalent}-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - aitalent-milvus-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    container_name: ${CONTAINER_PREFIX:-aitalent}-milvus-minio
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - aitalent-milvus-minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: ${CONTAINER_PREFIX:-aitalent}-milvus-standalone
    image: milvusdb/milvus:v2.6.24
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - aitalent-milvus-standalone-data:/var/lib/milvus
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    depends_on:
      - etcd
      - minio

volumes:
  aitalent-mysql-data:
  aitalent-milvus-etcd-data:
  aitalent-milvus-minio-data:
  aitalent-milvus-standalone-data:
