[pytest]
testpaths = tests
pythonpath = .
addopts = -q
markers =
    integration: L2 集成测试（连本地 MySQL / Milvus，不外呼 LLM）
    real_runner: 允许真启动 TaskRunner 常驻线程（默认被 conftest 打成空操作，见 tests/conftest.py）
    slow: 加载真实本地模型的重测试（本地 reranker/embedding 冒烟；默认不跳过，可用 -m "not slow" 排除）
# starlette 1.10 建议用 httpx2 跑 TestClient；当前 httpx 0.28 仍可用，仅提示，不影响结果
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
