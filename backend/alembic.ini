# Alembic migration chain config (G1 prerequisite, established 2026-11-07).
# NOTE: keep this file ASCII-only. configparser reads it with the system locale
# encoding on Windows (GBK); any non-ASCII byte breaks `alembic` startup.
# Migration scripts live in migrations/versions/; naming convention
# (A_*/C_*/B_*/D_*) is documented in docs/modules/A/迁移链说明.md.
# The DB URL is NOT stored here: env.py reads settings.database_url from
# each developer's own backend/.env; never commit real credentials.

[alembic]
script_location = migrations
prepend_sys_path = .
source_encoding = utf-8

# placeholder only; env.py overrides sqlalchemy.url from app settings
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
